<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazario — YourMart Products</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="container nav"><div class="logo">Bazario</div><nav><a href="#shop">Shop</a><a href="#cart">Cart <span id="cartCount">0</span></a></nav></div></header>
<section class="hero"><div class="container"><h1>Everything You Need, All in One Place.</h1><p>Quality products at affordable prices.</p><a class="btn" href="#shop">Shop Now</a></div></section>
<main class="container">
<section id="shop"><div class="section-head"><h2>Featured Products</h2><input id="search" placeholder="Search products..."></div><div id="products" class="grid"></div></section>
<section id="cart" class="cart-section"><h2>Your Cart</h2><div id="cartItems"></div><div class="cart-total">Total: Rs. <span id="cartTotal">0</span></div><button class="btn" onclick="checkoutWhatsApp()">Order on WhatsApp</button></section>
</main>
<footer><div class="container">© 2026 Bazario. All rights reserved.</div></footer>
<script src="script.js"></script>
</body></html>
